name: Build & Release Android

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag for manual builds (e.g. v1.0.0)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web bundle
        run: |
          npm install
          npm run build

      - name: Initialize and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode keystore and configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required Android signing secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > android/app/release.jks

          node -e '
            const fs = require("fs");
            const path = "android/app/build.gradle";
            let gradle = fs.readFileSync(path, "utf8");

            const signingBlock = [
              "    signingConfigs {",
              "        release {",
              "            storeFile file(\"release.jks\")",
              "            storePassword System.getenv(\"KEYSTORE_PASSWORD\")",
              "            keyAlias System.getenv(\"KEY_ALIAS\")",
              "            keyPassword System.getenv(\"KEY_PASSWORD\")",
              "        }",
              "    }",
              ""
            ].join("\n");

            if (!gradle.includes("signingConfigs")) {
              gradle = gradle.replace(/(\s*buildTypes\s*\{)/, `\n${signingBlock}$1`);
            }

            if (!gradle.includes("signingConfig signingConfigs.release")) {
              gradle = gradle.replace(
                /(buildTypes\s*\{[\s\S]*?release\s*\{)/,
                `$1\n            signingConfig signingConfigs.release`
              );
            }

            fs.writeFileSync(path, gradle, "utf8");
          '

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Prepare release APK for GitHub Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk WordVibe-release.apk

      - name: Upload APK and AAB workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordvibe-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v1.0.{0}', github.run_number)) }}
          name: WordVibe ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release_tag != '' && inputs.release_tag || format('v1.0.{0}', github.run_number)) }}
          files: WordVibe-release.apk
          make_latest: true
          generate_release_notes: true
